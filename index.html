<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TML Bonus Visual Tool</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  .block { min-width: 70px; padding: 4px; background-color: #bbf7d0; border: 2px solid #38bdf8; border-radius: 8px; text-align: center; transition: transform 0.3s ease; font-size: 0.7rem; position: relative; cursor: grab; }
  .block:hover { transform: scale(1.05); }
  .remove-btn { background-color: #ef4444; color: white; padding: 2px 4px; border-radius: 5px; font-size: 0.6rem; margin-top: 2px; cursor: pointer; }
  .level-container { display: flex; justify-content: center; gap: 6px; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .scrollable { max-height: 100vh; overflow-y: auto; }
  .progress-bar { background: #e5e7eb; border-radius: 8px; overflow: hidden; height: 20px; margin-top: 4px; }
  .progress-fill { background: #16a34a; height: 100%; width: 0%; transition: width 0.5s ease; }
</style>
</head>
<body class="bg-gradient-to-r from-green-200 to-blue-200 text-gray-800 p-4">
<div class="flex flex-col md:flex-row gap-4">
  <!-- Left Panel -->
  <div class="flex-1 scrollable bg-white p-4 rounded-2xl shadow-xl">
    <h1 class="text-xl font-bold mb-4">TML Bonus Visual Tool</h1>

    <div class="mb-4">
      <label class="block font-semibold">Your Name:
        <input id="yourName" type="text" placeholder="Enter your name" class="w-full p-2 border rounded">
      </label>
    </div>

    <div class="flex gap-2 mb-4">
      <label class="flex-1">Hydroace TT (2.5L units):
        <input id="ttUnits" type="number" value="0" class="w-full p-2 border rounded">
      </label>
      <label class="flex-1">Hydroace UTS (3L units):
        <input id="utsUnits" type="number" value="0" class="w-full p-2 border rounded">
      </label>
    </div>

    <div class="mb-4">
      <label class="block font-semibold">TML Monthly Company Profit (₹):
        <input id="companyProfit" type="number" value="0" class="w-full p-2 border rounded">
      </label>
    </div>

    <div class="mb-4">
      <label class="block font-semibold">Elite Rank:
        <select id="eliteRank" class="w-full p-2 border rounded">
          <option value="0">None</option>
          <option value="3">AVP (3%)</option>
          <option value="5">VP (5%)</option>
          <option value="6">SVP (6%)</option>
          <option value="7">President (7%)</option>
        </select>
      </label>
    </div>

    <div class="flex flex-wrap gap-2 mb-4">
      <button onclick="calculateBonus()" class="bg-green-600 text-white px-4 py-2 rounded">Calculate Bonus</button>
      <button onclick="clearAll()" class="bg-gray-500 text-white px-4 py-2 rounded">Clear</button>
      <button onclick="exportToPDF()" class="bg-red-500 text-white px-4 py-2 rounded">Export PDF</button>
      <button onclick="exportToExcel()" class="bg-blue-600 text-white px-4 py-2 rounded">Export Excel</button>
    </div>

    <div id="results" class="bg-green-100 p-3 rounded hidden"></div>
  </div>

  <!-- Right Panel -->
  <div class="w-full md:w-1/2 bg-white rounded-2xl shadow-xl p-4">
    <h2 class="text-lg font-semibold mb-2">Dashboard</h2>
    <div id="dashboard" class="space-y-2 text-sm"></div>

    <h2 class="text-lg font-semibold mt-4 mb-2">Genealogy Tree</h2>
    <div id="genealogyTree">
      <div id="level-0" class="level-container"></div>
      <div id="level-1" class="level-container"></div>
      <div id="level-2" class="level-container"></div>
      <div id="level-3" class="level-container"></div>
      <div id="level-4" class="level-container"></div>
      <div id="level-5" class="level-container"></div>
      <div id="level-6" class="level-container"></div>
    </div>
    <div class="mt-2">
      <select id="blockLevel" class="p-2 border rounded">
        <option value="1">Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="5">Level 5</option>
        <option value="6">Level 6</option>
      </select>
      <button onclick="addBlock()" class="ml-2 bg-blue-500 text-white px-3 py-1 rounded">Add Member</button>
    </div>
  </div>
</div>

<script>
let blockCount = 1;
let lifetimeEarnings = parseFloat(localStorage.getItem('lifetimeEarnings')) || 0;

function addBlock() {
  const level = document.getElementById('blockLevel').value;
  const container = document.getElementById(`level-${level}`);
  const block = document.createElement('div');
  block.className = 'block';
  block.draggable = true;
  block.innerHTML = `Member ${blockCount}<br>
    <select class="pv-select">
      <option value="250000">2.5L</option>
      <option value="300000">3L</option>
    </select>
    <div class="remove-btn" onclick="this.parentElement.remove()">Remove</div>`;
  container.appendChild(block);
  blockCount++;
}

function calculateBonus() {
  const ttUnits = parseInt(document.getElementById('ttUnits').value) || 0;
  const utsUnits = parseInt(document.getElementById('utsUnits').value) || 0;
  const profit = parseFloat(document.getElementById('companyProfit').value) || 0;
  const eliteRank = parseFloat(document.getElementById('eliteRank').value) || 0;

  // Self PV
  const selfPV = (ttUnits*250000) + (utsUnits*300000);
  const directPV = selfPV;
  const retailIncome = directPV*0.08;

  // Team PV
  let totalTeamPV = 0;
  document.querySelectorAll('.pv-select').forEach(sel => totalTeamPV += parseFloat(sel.value));
  const teamIncome = totalTeamPV*0.14;

  // Leadership bonus
  let rankBonus = 0;
  if (selfPV >= 9000000) rankBonus = 15;
  else if (selfPV >= 7500000) rankBonus = 11;
  else if (selfPV >= 6000000) rankBonus = 7.5;
  else if (selfPV >= 4500000) rankBonus = 4.5;
  else if (selfPV >= 3000000) rankBonus = 2;
  const leadershipIncome = selfPV*(rankBonus/100);

  const eliteBonus = profit*(eliteRank/100);
  const totalBonus = retailIncome + teamIncome + leadershipIncome + eliteBonus;

  // Update lifetime earnings
  lifetimeEarnings += totalBonus;
  localStorage.setItem('lifetimeEarnings', lifetimeEarnings);

  // Results box
  document.getElementById('results').innerHTML = `
    <p>Total PV: ₹${selfPV.toLocaleString()}</p>
    <p>Retail Income: ₹${retailIncome.toLocaleString()}</p>
    <p>Team Income: ₹${teamIncome.toLocaleString()}</p>
    <p>Leadership Bonus (${rankBonus}%): ₹${leadershipIncome.toLocaleString()}</p>
    <p>Elite Bonus: ₹${eliteBonus.toLocaleString()}</p>
    <hr>
    <p class='text-lg font-bold text-green-700'>Total Bonus: ₹${totalBonus.toLocaleString()}</p>
  `;

  // Dashboard
  let nextMilestone = 3000000;
  if (selfPV < 3000000) nextMilestone = 3000000;
  else if (selfPV < 4500000) nextMilestone = 4500000;
  else if (selfPV < 6000000) nextMilestone = 6000000;
  else if (selfPV < 7500000) nextMilestone = 7500000;
  else if (selfPV < 9000000) nextMilestone = 9000000;
  else nextMilestone = 9000000;

  const progressPercent = Math.min((selfPV/nextMilestone)*100,100);

  document.getElementById('dashboard').innerHTML = `
    <div class='p-3 bg-green-50 rounded shadow'>This Month's Bonus: <strong>₹${totalBonus.toLocaleString()}</strong></div>
    <div class='p-3 bg-blue-50 rounded shadow'>Retail Income: ₹${retailIncome.toLocaleString()}</div>
    <div class='p-3 bg-yellow-50 rounded shadow'>Team Income: ₹${teamIncome.toLocaleString()}</div>
    <div class='p-3 bg-purple-50 rounded shadow'>Leadership Income: ₹${leadershipIncome.toLocaleString()}</div>
    <div class='p-3 bg-pink-50 rounded shadow'>Elite Bonus: ₹${eliteBonus.toLocaleString()}</div>
    <div class='p-3 bg-gray-50 rounded shadow'>Lifetime Earnings: ₹${lifetimeEarnings.toLocaleString()}</div>
    <div class='mt-2'>Progress to Next Rank (Next Milestone: ₹${nextMilestone.toLocaleString()}):
      <div class='progress-bar'><div class='progress-fill' style='width: ${progressPercent}%;'></div></div>
      <small>${progressPercent.toFixed(1)}%</small>
    </div>
  `;
}

function clearAll() {
  document.getElementById('yourName').value = '';
  document.getElementById('ttUnits').value = '0';
  document.getElementById('utsUnits').value = '0';
  document.getElementById('companyProfit').value = '0';
  document.getElementById('eliteRank').value = '0';
  document.getElementById('results').innerHTML = '';
  document.getElementById('results').classList.add('hidden');
  document.getElementById('dashboard').innerHTML = '';
  for (let i=0;i<=6;i++) document.getElementById(`level-${i}`).innerHTML='';
}

function exportToPDF() {
  html2canvas(document.getElementById("results")).then(canvas => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const imgData = canvas.toDataURL("image/png");
    doc.addImage(imgData, 'PNG', 10, 10);
    doc.save("TML_Bonus_Summary.pdf");
  });
}

function exportToExcel() {
  const tableHTML = `<table><tr><td>Total PV</td><td>Retail Income</td><td>Team Income</td><td>Leadership Bonus</td><td>Elite Bonus</td><td>Total Bonus</td></tr>` +
    `<tr><td>${document.getElementById('results').innerText.replace(/\n/g,'</td><td>')}</td></tr></table>`;
  const ws = XLSX.utils.table_to_sheet(new DOMParser().parseFromString(tableHTML,'text/html').querySelector('table'));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bonus Summary");
  XLSX.writeFile(wb, "TML_Bonus_Summary.xlsx");
}
</script>
