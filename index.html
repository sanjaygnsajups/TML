<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Modern Living Bonus Calculator</title>
  <link rel="icon" href="https://via.placeholder.com/32" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0f172a',
            secondary: '#2563eb',
            accent: '#22c55e'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 dark:bg-gray-900 dark:text-gray-200">
  <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl">
    <div class="flex flex-col items-center mb-4">
      <img src="https://via.placeholder.com/100x100?text=Logo" alt="Logo" class="mb-2 rounded-full shadow-md">
      <h1 class="text-3xl font-extrabold text-center text-primary dark:text-white animate-pulse">💼 The Modern Living</h1>
    </div>

    <!-- Preset Scenarios -->
    <div class="mb-4">
      <label class="font-semibold">💡 Choose a Success Scenario:</label>
      <select onchange="applyScenario(this.value)" class="w-full p-2 border rounded">
        <option value="">-- Select Scenario --</option>
        <option value="beginner">Beginner</option>
        <option value="rising">Rising Leader</option>
        <option value="star">Star Performer</option>
      </select>
    </div>

    <!-- Dark Mode Toggle -->
    <div class="flex justify-end mb-4">
      <button onclick="document.documentElement.classList.toggle('dark')" class="text-sm px-3 py-1 bg-gray-300 dark:bg-gray-700 rounded">🌓 Toggle Dark Mode</button>
    </div>

    <form id="bonusForm" class="grid grid-cols-1 gap-4">
      <label title="Direct sales generate 8% income">Direct Sales PV: <input type="number" id="directPV" value="0" class="w-full p-2 border rounded" /></label>

      <div class="grid grid-cols-2 gap-4">
        <label title="Level 1: 4% bonus">Level 1 PV: <input type="number" id="level1" value="0" class="w-full p-2 border rounded" /></label>
        <label title="Level 2: 3% bonus">Level 2 PV: <input type="number" id="level2" value="0" class="w-full p-2 border rounded" /></label>
        <label title="Level 3: 3% bonus">Level 3 PV: <input type="number" id="level3" value="0" class="w-full p-2 border rounded" /></label>
        <label title="Level 4: 2% bonus">Level 4 PV: <input type="number" id="level4" value="0" class="w-full p-2 border rounded" /></label>
        <label title="Level 6: 2% bonus">Level 6 PV: <input type="number" id="level6" value="0" class="w-full p-2 border rounded" /></label>
      </div>

      <label>Leadership Rank:
        <select id="rank" class="w-full p-2 border rounded">
          <option value="0">None</option>
          <option value="2">1 Star (2%)</option>
          <option value="4.5">2 Star (4.5%)</option>
          <option value="7.5">3 Star (7.5%)</option>
          <option value="11">4 Star (11%)</option>
          <option value="15">5 Star (15%)</option>
        </select>
      </label>

      <div class="grid grid-cols-3 gap-4">
        <label>1st Gen 5-Star Count: <input type="number" id="gen1" value="0" class="w-full p-2 border rounded" /></label>
        <label>2nd Gen 5-Star Count: <input type="number" id="gen2" value="0" class="w-full p-2 border rounded" /></label>
        <label>3rd Gen 5-Star Count: <input type="number" id="gen3" value="0" class="w-full p-2 border rounded" /></label>
      </div>

      <label>5-Star Leaders in Parallel Lines: <input type="number" id="parallel5Stars" value="0" class="w-full p-2 border rounded" /></label>
      <label>AVP Leaders in Parallel Lines: <input type="number" id="parallelAVPs" value="0" class="w-full p-2 border rounded" /></label>
      <label>TML Yearly Profit (₹): <input type="number" id="companyProfit" value="0" class="w-full p-2 border rounded" /></label>

      <!-- Buttons -->
      <div class="flex gap-4 mt-4">
        <button type="button" onclick="calculateBonus()" class="bg-green-600 text-white px-4 py-2 rounded">🚀 Calculate</button>
        <button type="reset" onclick="clearResult()" class="bg-gray-500 text-white px-4 py-2 rounded">🔄 Clear All</button>
      </div>
    </form>

    <!-- Results -->
    <div id="result" class="mt-6 space-y-4 hidden"></div>
    <div id="motivate" class="text-center mt-6 text-blue-700 dark:text-blue-300 font-semibold text-lg hidden">💬 Grow your network. Hit your Star Rank. Multiply your income!</div>
  </div>

  <script>
    function calculateBonus() {
      const directPV = parseFloat(document.getElementById('directPV').value) || 0;
      const level1 = parseFloat(document.getElementById('level1').value) || 0;
      const level2 = parseFloat(document.getElementById('level2').value) || 0;
      const level3 = parseFloat(document.getElementById('level3').value) || 0;
      const level4 = parseFloat(document.getElementById('level4').value) || 0;
      const level6 = parseFloat(document.getElementById('level6').value) || 0;
      const rankBonus = parseFloat(document.getElementById('rank').value) || 0;
      const gen1 = parseInt(document.getElementById('gen1').value) || 0;
      const gen2 = parseInt(document.getElementById('gen2').value) || 0;
      const gen3 = parseInt(document.getElementById('gen3').value) || 0;
      const parallel5Stars = parseInt(document.getElementById('parallel5Stars').value) || 0;
      const parallelAVPs = parseInt(document.getElementById('parallelAVPs').value) || 0;
      const profit = parseFloat(document.getElementById('companyProfit').value) || 0;

      const totalPV = directPV + level1 + level2 + level3 + level4 + level6;
      const retailIncome = directPV * 0.08;
      const teamIncome = level1 * 0.04 + level2 * 0.03 + level3 * 0.03 + level4 * 0.02 + level6 * 0.02;
      const leadershipIncome = totalPV * (rankBonus / 100);
      const genIncome = totalPV * (gen1 * 0.02 + gen2 * 0.01 + gen3 * 0.005);

      let eliteBonus = 0;
      if (parallel5Stars >= 5 && parallelAVPs >= 5) {
        eliteBonus = profit * 0.07;
      } else if (parallel5Stars >= 5) {
        eliteBonus = profit * 0.06;
      } else if (parallel5Stars >= 4) {
        eliteBonus = profit * 0.05;
      } else if (parallel5Stars >= 3) {
        eliteBonus = profit * 0.03;
      }

      const total = retailIncome + teamIncome + leadershipIncome + genIncome + eliteBonus;

      const bonuses = [
        { name: "💸 Retail Income", value: retailIncome },
        { name: "👥 Team Income", value: teamIncome },
        { name: "🏅 Leadership Bonus", value: leadershipIncome },
        { name: "🌱 Generation Income", value: genIncome },
        { name: "👑 Elite Bonus", value: eliteBonus },
      ];

      const maxBonus = Math.max(...bonuses.map(b => b.value));

      document.getElementById('result').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${bonuses.map(b => `<div class="bg-white p-4 rounded shadow ${b.value === maxBonus ? 'border-2 border-green-500' : ''}"><strong>${b.name}:</strong><br> ₹${b.value.toFixed(2)}</div>`).join('')}
        </div>
        <div class="mt-4 text-2xl font-bold text-green-700 text-center">
          💰 Total Bonus: ₹${total.toFixed(2)}
        </div>
      `;
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('motivate').classList.remove('hidden');
    }

    function clearResult() {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('result').innerHTML = '';
      document.getElementById('motivate').classList.add('hidden');
    }
  </script>
</body>
</html>
