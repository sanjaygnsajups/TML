<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TML Bonus Visual Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .block {
      min-width: 120px;
      padding: 10px;
      background-color: #bbf7d0;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .block:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 text-gray-800 p-4">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold mb-6 text-center text-green-700">🌟 TML Bonus Visual Tool</h1>

    <div class="mb-4 text-center">
      <button onclick="addBlock(true)" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">➕ Add You (Level 0)</button>
      <button onclick="addBlock(false)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded ml-2">➕ Add Member Block</button>
      <p class="text-sm text-gray-500">Add yourself and team members with product values and levels</p>
    </div>

    <div id="tree" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8"></div>

    <div class="grid grid-cols-1 gap-4 mb-4">
      <label>Direct Sales PV:
        <input type="number" id="directPV" placeholder="100000" class="border p-2 rounded w-full">
      </label>

      <label>TML Monthly Company Profit (₹):
        <input type="number" id="companyProfit" placeholder="100000" class="border p-2 rounded w-full">
      </label>

      <div class="grid grid-cols-3 gap-4">
        <label>1st Gen 5-Star:
          <input type="number" id="gen1" class="border p-2 rounded w-full">
        </label>
        <label>2nd Gen 5-Star:
          <input type="number" id="gen2" class="border p-2 rounded w-full">
        </label>
        <label>3rd Gen 5-Star:
          <input type="number" id="gen3" class="border p-2 rounded w-full">
        </label>
      </div>

      <label>Elite Rank:
        <select id="eliteRank" class="border p-2 rounded w-full">
          <option value="">-- Select --</option>
          <option value="3">AVP (3%)</option>
          <option value="5">VP (3% + 2%)</option>
          <option value="6">SVP (3% + 2% + 1%)</option>
          <option value="7">President (3% + 2% + 1% + 1%)</option>
        </select>
      </label>
    </div>

    <div class="text-center mb-4 flex gap-4 justify-center flex-wrap">
      <button onclick="calculateBonuses()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">🎯 Calculate Bonus</button>
      <button onclick="clearAll()" class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-2 rounded">❌ Clear</button>
      <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">📥 Export to Excel</button>
      <button onclick="window.print()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2 rounded">🖨️ Print / PDF</button>
    </div>

    <div id="results" class="hidden p-4 bg-green-100 rounded">
      <h2 class="text-xl font-semibold mb-2">📊 Bonus Summary</h2>
      <p>Total PV: ₹<span id="totalPV">0</span></p>
      <p>Total Units: <span id="totalUnits">0</span></p>
      <p>Retail Income (8%): ₹<span id="retail">0</span></p>
      <p>Team Retail Income: ₹<span id="team">0</span></p>
      <p>Leadership Rank: <span id="rankLabel">None</span></p>
      <p>Leadership Bonus: ₹<span id="leadership">0</span></p>
      <p>Generation Income: ₹<span id="generation">0</span></p>
      <p>Elite Bonus: ₹<span id="elite">0</span></p>
      <p class="font-bold text-lg">Total Bonus: ₹<span id="totalBonus">0</span></p>
    </div>
  </div>

  <script>
    const tree = document.getElementById('tree');
    let blockCount = 0;

    function addBlock(isSelf = false) {
      const div = document.createElement('div');
      div.className = 'block';
      div.innerHTML = `
        <input placeholder="${isSelf ? 'You (Self)' : 'Name'}" class="w-full p-1 mb-1 border rounded" ${isSelf ? 'readonly' : ''} />
        <select class="productValue w-full p-1 border rounded">
          <option value="250000">TT (₹2.5L)</option>
          <option value="300000">UTS (₹3L)</option>
        </select>
        <select class="level w-full p-1 mt-1 border rounded">
          ${isSelf ? '<option value="0">Level 0 (You)</option>' : '<option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option>'}
        </select>`;
      tree.appendChild(div);
      blockCount++;
    }
  </script>
</body>
</html>
