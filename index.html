<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Modern Living Bonus Calculator</title>
  <link rel="icon" href="https://via.placeholder.com/32" />
  <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0f172a',
            secondary: '#2563eb',
            accent: '#22c55e'
          }
        }
      }
    }
  </script>
<script>
function downloadExcel() {
  let table = document.querySelector('#simulationResult table');
  let rows = Array.from(table.querySelectorAll('tr')).map(row =>
    Array.from(row.querySelectorAll('td, th')).map(cell => cell.innerText)
  );
  let csvContent = 'data:text/csv;charset=utf-8,' + rows.map(e => e.join(",")).join("
");
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "mlm_income_report.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function downloadPDF() {
  const element = document.getElementById('simulationResult');
  const opt = {
    margin:       0.5,
    filename:     'mlm_income_report.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };
  html2pdf().from(element).set(opt).save();
}

function shareResult() {
  const text = 'Check out my MLM income projection using The Modern Living Calculator!';
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: 'MLM Calculator', text, url });
  } else {
    alert('Share this link: ' + url);
  }
}

simulateDownline = (function(original) {
  return function(...args) {
    original(...args);
    document.getElementById('exportButtons').classList.remove('hidden');
  }
})(simulateDownline);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 dark:bg-gray-900 dark:text-gray-200">
  <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl">
    <div class="flex flex-col items-center mb-4">
      <img src="https://via.placeholder.com/100x100?text=Logo" alt="Logo" class="mb-2 rounded-full shadow-md">
      <h1 class="text-3xl font-extrabold text-center text-primary dark:text-white animate-pulse">💼 The Modern Living</h1>
    </div>

    <!-- Downline Simulator -->
    <div class="bg-blue-50 dark:bg-blue-900 p-4 rounded mb-6">
      <h2 class="text-xl font-bold mb-2 text-blue-700 dark:text-blue-300">📊 Downline Income Simulator</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label>Referrals Per Person: <input type="number" id="referrals" value="3" class="w-full p-2 border rounded" /></label>
        <label>Units Per Person: <input type="number" id="unitsPerPerson" value="1" class="w-full p-2 border rounded" /></label>
        <label>Product Price (₹):
          <select id="productPrice" class="w-full p-2 border rounded">
            <option value="250000">Hydroace TT (₹2,50,000)</option>
            <option value="300000">Hydroace UTS (₹3,00,000)</option>
          </select>
        </label>
        <label>Levels Deep: <input type="number" id="depth" value="6" min="1" max="6" class="w-full p-2 border rounded" /></label>
      </div>
      <div class="mt-4">
        <button onclick="simulateDownline()" class="bg-blue-600 text-white px-4 py-2 rounded">Simulate Downline</button>
      </div>
      <div id="simulationResult" class="mt-4 hidden"></div>
<div class="flex gap-4 mt-4 hidden" id="exportButtons">
  <button onclick="downloadExcel()" class="bg-green-600 text-white px-4 py-2 rounded">📥 Export to Excel</button>
  <button onclick="downloadPDF()" class="bg-red-600 text-white px-4 py-2 rounded">📄 Export to PDF</button>
  <button onclick="shareResult()" class="bg-blue-700 text-white px-4 py-2 rounded">🔗 Share</button>
</div>
    </div>

    <!-- Manual Calculator -->
    <div class="bg-green-50 dark:bg-green-900 p-4 rounded mb-6">
      <h2 class="text-xl font-bold mb-2 text-green-700 dark:text-green-300">🧮 Manual Bonus Calculator</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label>Direct Sales PV: <input type="number" id="directPV" class="w-full p-2 border rounded" /></label>
        <label>Team PV (Level 1): <input type="number" id="level1" class="w-full p-2 border rounded" /></label>
        <label>Team PV (Level 2): <input type="number" id="level2" class="w-full p-2 border rounded" /></label>
        <label>Team PV (Level 3): <input type="number" id="level3" class="w-full p-2 border rounded" /></label>
        <label>Team PV (Level 4): <input type="number" id="level4" class="w-full p-2 border rounded" /></label>
        <label>Team PV (Level 6): <input type="number" id="level6" class="w-full p-2 border rounded" /></label>
      </div>
      <div class="mt-4">
        <button onclick="calculateManualBonus()" class="bg-green-600 text-white px-4 py-2 rounded">Calculate Income</button>
      </div>
      <div id="manualResult" class="mt-4"></div>
    </div>

    <script>
      function simulateDownline() {
        const referrals = parseInt(document.getElementById('referrals').value) || 0;
        const units = parseInt(document.getElementById('unitsPerPerson').value) || 0;
        const price = parseInt(document.getElementById('productPrice').value) || 0;
        const depth = parseInt(document.getElementById('depth').value) || 0;

        const levels = [];
        let members = 1;

        for (let i = 1; i <= depth; i++) {
          members = Math.pow(referrals, i);
          const pv = members * units * price;
          let bonusPercent = 0;
          if (i === 1) bonusPercent = 0.04;
          else if (i === 2) bonusPercent = 0.03;
          else if (i === 3) bonusPercent = 0.03;
          else if (i === 4) bonusPercent = 0.02;
          else if (i === 6) bonusPercent = 0.02;
          const income = pv * bonusPercent;
          levels.push({ level: i, members, pv, bonusPercent, income });
        }

        const totalPV = levels.reduce((sum, l) => sum + l.pv, 0);
        let rank = 'None';
        if (totalPV >= 9000000) rank = '5 Star';
        else if (totalPV >= 7500000) rank = '4 Star';
        else if (totalPV >= 6000000) rank = '3 Star';
        else if (totalPV >= 4500000) rank = '2 Star';
        else if (totalPV >= 3000000) rank = '1 Star';

        document.getElementById('simulationResult').innerHTML = `
          <div class="overflow-x-auto">
            <table class="w-full text-sm text-left border">
              <thead class="bg-blue-100 dark:bg-blue-800">
                <tr>
                  <th class="p-2">Level</th>
                  <th class="p-2">Members</th>
                  <th class="p-2">PV</th>
                  <th class="p-2">Bonus %</th>
                  <th class="p-2">Team Income (₹)</th>
                </tr>
              </thead>
              <tbody>
                ${levels.map(l => `
                  <tr class="border-t">
                    <td class="p-2">${l.level}</td>
                    <td class="p-2">${l.members}</td>
                    <td class="p-2">${l.pv.toLocaleString()}</td>
                    <td class="p-2">${(l.bonusPercent * 100).toFixed(1)}%</td>
                    <td class="p-2">₹${l.income.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          
        `;
        document.getElementById('simulationResult').classList.remove('hidden');
      }
    function calculateManualBonus() {
  const directPV = parseInt(document.getElementById('directPV').value) || 0;
  const level1 = parseInt(document.getElementById('level1').value) || 0;
  const level2 = parseInt(document.getElementById('level2').value) || 0;
  const level3 = parseInt(document.getElementById('level3').value) || 0;
  const level4 = parseInt(document.getElementById('level4').value) || 0;
  const level6 = parseInt(document.getElementById('level6').value) || 0;

  const retailIncome = directPV * 0.08;
  const teamIncome = level1 * 0.04 + level2 * 0.03 + level3 * 0.03 + level4 * 0.02 + level6 * 0.02;
  const totalPV = directPV + level1 + level2 + level3 + level4 + level6;

  let rank = 'None';
  let leadershipBonus = 0;
  if (totalPV >= 9000000) { rank = '5 Star'; leadershipBonus = totalPV * 0.15; }
  else if (totalPV >= 7500000) { rank = '4 Star'; leadershipBonus = totalPV * 0.11; }
  else if (totalPV >= 6000000) { rank = '3 Star'; leadershipBonus = totalPV * 0.075; }
  else if (totalPV >= 4500000) { rank = '2 Star'; leadershipBonus = totalPV * 0.045; }
  else if (totalPV >= 3000000) { rank = '1 Star'; leadershipBonus = totalPV * 0.02; }

  const totalIncome = retailIncome + teamIncome + leadershipBonus;

  document.getElementById('manualResult').innerHTML = `
    <div class="space-y-2 text-sm">
      <div>🛒 Retail Income: ₹${retailIncome.toLocaleString()}</div>
      <div>👥 Team Income: ₹${teamIncome.toLocaleString()}</div>
      <div>🏆 Leadership Bonus (${rank}): ₹${leadershipBonus.toLocaleString()}</div>
      <div class="font-bold text-lg text-green-700">💰 Total Income: ₹${totalIncome.toLocaleString()}</div>
    </div>
  `;
}
</script>
  </div>
</body>
</html>
