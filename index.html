<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLM Bonus Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold mb-4 text-center text-blue-700">💼 MLM Bonus Calculator</h1>

    <!-- Preset Scenarios -->
    <div class="mb-4">
      <label class="font-semibold">💡 Choose a Success Scenario:</label>
      <select onchange="applyScenario(this.value)" class="w-full p-2 border rounded">
        <option value="">-- Select Scenario --</option>
        <option value="beginner">Beginner</option>
        <option value="rising">Rising Leader</option>
        <option value="star">Star Performer</option>
      </select>
    </div>

    <form id="bonusForm" class="grid grid-cols-1 gap-4">
      <label>Direct Sales PV: <input type="number" id="directPV" value="0" class="w-full p-2 border rounded" /></label>

      <div class="grid grid-cols-2 gap-4">
        <label>Level 1 PV: <input type="number" id="level1" value="0" class="w-full p-2 border rounded" /></label>
        <label>Level 2 PV: <input type="number" id="level2" value="0" class="w-full p-2 border rounded" /></label>
        <label>Level 3 PV: <input type="number" id="level3" value="0" class="w-full p-2 border rounded" /></label>
        <label>Level 4 PV: <input type="number" id="level4" value="0" class="w-full p-2 border rounded" /></label>
        <label>Level 6 PV: <input type="number" id="level6" value="0" class="w-full p-2 border rounded" /></label>
      </div>

      <label>Leadership Rank:
        <select id="rank" class="w-full p-2 border rounded">
          <option value="0">None</option>
          <option value="2">1 Star (2%)</option>
          <option value="4.5">2 Star (4.5%)</option>
          <option value="7.5">3 Star (7.5%)</option>
          <option value="11">4 Star (11%)</option>
          <option value="15">5 Star (15%)</option>
        </select>
      </label>

      <div class="grid grid-cols-3 gap-4">
        <label>1st Gen 5-Star Count: <input type="number" id="gen1" value="0" class="w-full p-2 border rounded" /></label>
        <label>2nd Gen 5-Star Count: <input type="number" id="gen2" value="0" class="w-full p-2 border rounded" /></label>
        <label>3rd Gen 5-Star Count: <input type="number" id="gen3" value="0" class="w-full p-2 border rounded" /></label>
      </div>

      <label>TML Yearly Profit (₹): <input type="number" id="companyProfit" value="0" class="w-full p-2 border rounded" /></label>

      <label>Elite Rank:
        <select id="eliteRank" class="w-full p-2 border rounded">
          <option value="0">None</option>
          <option value="3">AVP (3%)</option>
          <option value="5">VP (3% + 2%)</option>
          <option value="6">SVP (3% + 2% + 1%)</option>
          <option value="7">President (3% + 2% + 1% + 1%)</option>
        </select>
      </label>

      <!-- Buttons -->
      <div class="flex gap-4 mt-4">
        <button type="button" onclick="calculateBonus()" class="bg-green-600 text-white px-4 py-2 rounded">🚀 Calculate</button>
        <button type="reset" onclick="clearResult()" class="bg-gray-500 text-white px-4 py-2 rounded">🔄 Clear All</button>
      </div>
    </form>

    <!-- Results -->
    <div id="result" class="mt-6 space-y-4 hidden"></div>

    <div id="motivate" class="text-center mt-6 text-blue-700 font-semibold text-lg hidden">💬 Grow your network. Hit your Star Rank. Multiply your income!</div>
  </div>

  <script>
    function applyScenario(type) {
      const data = {
        beginner: {
          directPV: 250000,
          level1: 100000,
          level2: 50000,
          level3: 25000,
          level4: 10000,
          level6: 5000,
          rank: "2",
          gen1: 0,
          gen2: 0,
          gen3: 0,
          companyProfit: 1000000,
          eliteRank: "0"
        },
        rising: {
          directPV: 500000,
          level1: 300000,
          level2: 200000,
          level3: 150000,
          level4: 100000,
          level6: 75000,
          rank: "4.5",
          gen1: 1,
          gen2: 0,
          gen3: 0,
          companyProfit: 1500000,
          eliteRank: "3"
        },
        star: {
          directPV: 750000,
          level1: 500000,
          level2: 400000,
          level3: 300000,
          level4: 200000,
          level6: 100000,
          rank: "15",
          gen1: 2,
          gen2: 1,
          gen3: 1,
          companyProfit: 2000000,
          eliteRank: "7"
        }
      };
      if (!data[type]) return;
      for (let key in data[type]) {
        document.getElementById(key).value = data[type][key];
      }
    }

    function calculateBonus() {
      const directPV = parseFloat(document.getElementById('directPV').value) || 0;
      const level1 = parseFloat(document.getElementById('level1').value) || 0;
      const level2 = parseFloat(document.getElementById('level2').value) || 0;
      const level3 = parseFloat(document.getElementById('level3').value) || 0;
      const level4 = parseFloat(document.getElementById('level4').value) || 0;
      const level6 = parseFloat(document.getElementById('level6').value) || 0;
      const rankBonus = parseFloat(document.getElementById('rank').value) || 0;
      const gen1 = parseInt(document.getElementById('gen1').value) || 0;
      const gen2 = parseInt(document.getElementById('gen2').value) || 0;
      const gen3 = parseInt(document.getElementById('gen3').value) || 0;
      const profit = parseFloat(document.getElementById('companyProfit').value) || 0;
      const eliteRank = parseFloat(document.getElementById('eliteRank').value) || 0;

      const totalPV = directPV + level1 + level2 + level3 + level4 + level6;
      const retailIncome = directPV * 0.08;
      const teamIncome = level1 * 0.04 + level2 * 0.03 + level3 * 0.03 + level4 * 0.02 + level6 * 0.02;
      const leadershipIncome = totalPV * (rankBonus / 100);
      const genIncome = totalPV * (gen1 * 0.02 + gen2 * 0.01 + gen3 * 0.005);
      const eliteBonus = profit * (eliteRank / 100);
      const total = retailIncome + teamIncome + leadershipIncome + genIncome + eliteBonus;

      document.getElementById('result').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white p-4 rounded shadow"><strong>💸 Retail Income:</strong><br> ₹${retailIncome.toFixed(2)}</div>
          <div class="bg-white p-4 rounded shadow"><strong>👥 Team Income:</strong><br> ₹${teamIncome.toFixed(2)}</div>
          <div class="bg-white p-4 rounded shadow"><strong>🏅 Leadership Bonus:</strong><br> ₹${leadershipIncome.toFixed(2)}</div>
          <div class="bg-white p-4 rounded shadow"><strong>🌱 Generation Income:</strong><br> ₹${genIncome.toFixed(2)}</div>
          <div class="bg-white p-4 rounded shadow"><strong>👑 Elite Bonus:</strong><br> ₹${eliteBonus.toFixed(2)}</div>
        </div>
        <div class="mt-4 text-2xl font-bold text-green-700 text-center">
          💰 Total Bonus: ₹${total.toFixed(2)}
        </div>
      `;
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('motivate').classList.remove('hidden');
    }

    function clearResult() {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('result').innerHTML = '';
      document.getElementById('motivate').classList.add('hidden');
    }
  </script>
</body>
</html>
