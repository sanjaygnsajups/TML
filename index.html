<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TML Bonus Visual Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .block {
      min-width: 100px;
      padding: 8px;
      background-color: #bbf7d0;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.3s ease;
      font-size: 0.875rem;
    }
    .block:hover {
      transform: scale(1.05);
    }
    .remove-btn {
      background-color: #ef4444;
      color: white;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.75rem;
      margin-top: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 text-gray-800 p-4">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold mb-6 text-center text-green-700">🌟 TML Bonus Visual Tool</h1>

    <div class="mb-4 text-center">
      <p class="text-lg font-semibold mb-2">Enter Your Name and Direct Sales PV</p>
      <div class="flex flex-col sm:flex-row justify-center gap-4 mb-4">
        <input type="text" id="yourName" placeholder="Your Name" class="border p-2 rounded w-full sm:w-1/3">
        <input type="number" id="directPV" placeholder="Direct Sales PV (e.g. 250000)" class="border p-2 rounded w-full sm:w-1/3">
      </div>
      <button onclick="addBlock(true)" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">➕ Add Your Block (Level 0)</button>
      <button onclick="addBlock(false)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded ml-2">➕ Add Member Block</button>
    </div>

    <div id="tree" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-8"></div>

    <div class="grid grid-cols-1 gap-4 mb-4">
      <label>TML Monthly Company Profit (₹):
        <input type="number" id="companyProfit" placeholder="100000" class="border p-2 rounded w-full">
      </label>

      <div class="grid grid-cols-3 gap-4">
        <label>1st Gen 5-Star:
          <input type="number" id="gen1" class="border p-2 rounded w-full">
        </label>
        <label>2nd Gen 5-Star:
          <input type="number" id="gen2" class="border p-2 rounded w-full">
        </label>
        <label>3rd Gen 5-Star:
          <input type="number" id="gen3" class="border p-2 rounded w-full">
        </label>
      </div>

      <label>Elite Rank:
        <select id="eliteRank" class="border p-2 rounded w-full">
          <option value="">-- Select --</option>
          <option value="3">AVP (3%)</option>
          <option value="5">VP (3% + 2%)</option>
          <option value="6">SVP (3% + 2% + 1%)</option>
          <option value="7">President (3% + 2% + 1% + 1%)</option>
        </select>
      </label>
    </div>

    <div class="text-center mb-4 flex gap-4 justify-center flex-wrap">
      <button onclick="calculateBonuses()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">🎯 Calculate Bonus</button>
      <button onclick="clearAll()" class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-2 rounded">❌ Clear</button>
      <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">📥 Export to Excel</button>
      <button onclick="window.print()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2 rounded">🖨️ Print / PDF</button>
    </div>

    <div id="results" class="hidden p-4 bg-green-100 rounded">
      <h2 class="text-xl font-semibold mb-2">📊 Bonus Summary</h2>
      <p>Total PV: ₹<span id="totalPV">0</span></p>
      <p>Total Units: <span id="totalUnits">0</span></p>
      <p>Retail Income (8%): ₹<span id="retail">0</span></p>
      <p>Team Retail Income: ₹<span id="team">0</span></p>
      <p>Leadership Rank: <span id="rankLabel">None</span></p>
      <p>Leadership Bonus: ₹<span id="leadership">0</span></p>
      <p>Generation Income: ₹<span id="generation">0</span></p>
      <p>Elite Bonus: ₹<span id="elite">0</span></p>
      <p class="font-bold text-lg">Total Bonus: ₹<span id="totalBonus">0</span></p>
    </div>
  </div>

  <script>
    const tree = document.getElementById('tree');
    let blockCount = 0;

    function addBlock(isSelf = false) {
      const div = document.createElement('div');
      div.className = 'block';
      div.innerHTML = `
        <input placeholder="${isSelf ? document.getElementById('yourName').value || 'You (Self)' : 'Name'}" class="w-full p-1 mb-1 border rounded" ${isSelf ? 'readonly' : ''} />
        <select class="productValue w-full p-1 border rounded">
          <option value="250000">TT (₹2.5L)</option>
          <option value="300000">UTS (₹3L)</option>
        </select>
        <select class="level w-full p-1 mt-1 border rounded">
          ${isSelf ? '<option value="0">Level 0 (You)</option>' : '<option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option>'}
        </select>
        <div class="remove-btn" onclick="this.parentElement.remove()">Remove</div>
      `;
      tree.appendChild(div);
      blockCount++;
    }

    function calculateBonuses() {
      const directPV = parseFloat(document.getElementById('directPV').value) || 0;
      const blocks = document.querySelectorAll('#tree .block');
      let levelPVs = [0, 0, 0, 0, 0, 0, 0];
      let totalUnits = 0;

      blocks.forEach(block => {
        const level = parseInt(block.querySelector('.level').value);
        const pv = parseFloat(block.querySelector('.productValue').value);
        if (!isNaN(level) && !isNaN(pv)) {
          levelPVs[level] += pv;
          totalUnits++;
        }
      });

      const totalPV = directPV + levelPVs.slice(1).reduce((a, b) => a + b, 0);
      const retailIncome = directPV * 0.08;
      const teamIncome = levelPVs[1] * 0.04 + levelPVs[2] * 0.03 + levelPVs[3] * 0.03 + levelPVs[4] * 0.02 + levelPVs[6] * 0.02;

      // Determine leadership rank based on PV
      let rank = 'None';
      let rankPercent = 0;
      if (totalPV >= 9000000) { rank = '5 Star (15%)'; rankPercent = 15; }
      else if (totalPV >= 7500000) { rank = '4 Star (11%)'; rankPercent = 11; }
      else if (totalPV >= 6000000) { rank = '3 Star (7.5%)'; rankPercent = 7.5; }
      else if (totalPV >= 4500000) { rank = '2 Star (4.5%)'; rankPercent = 4.5; }
      else if (totalPV >= 3000000) { rank = '1 Star (2%)'; rankPercent = 2; }

      const leadershipIncome = totalPV * (rankPercent / 100);
      const genIncome = totalPV * (parseInt(document.getElementById('gen1').value || 0) * 0.02 + parseInt(document.getElementById('gen2').value || 0) * 0.01 + parseInt(document.getElementById('gen3').value || 0) * 0.005);
      const elitePercent = parseFloat(document.getElementById('eliteRank').value) || 0;
      const eliteBonus = (parseFloat(document.getElementById('companyProfit').value) || 0) * (elitePercent / 100);
      const totalBonus = retailIncome + teamIncome + leadershipIncome + genIncome + eliteBonus;

      document.getElementById('totalPV').innerText = totalPV.toFixed(2);
      document.getElementById('totalUnits').innerText = totalUnits;
      document.getElementById('retail').innerText = retailIncome.toFixed(2);
      document.getElementById('team').innerText = teamIncome.toFixed(2);
      document.getElementById('rankLabel').innerText = rank;
      document.getElementById('leadership').innerText = leadershipIncome.toFixed(2);
      document.getElementById('generation').innerText = genIncome.toFixed(2);
      document.getElementById('elite').innerText = eliteBonus.toFixed(2);
      document.getElementById('totalBonus').innerText = totalBonus.toFixed(2);
      document.getElementById('results').classList.remove('hidden');
    }

    function clearAll() {
      document.getElementById('yourName').value = '';
      document.getElementById('directPV').value = '';
      document.getElementById('companyProfit').value = '';
      document.getElementById('gen1').value = '';
      document.getElementById('gen2').value = '';
      document.getElementById('gen3').value = '';
      document.getElementById('eliteRank').value = '';
      document.getElementById('results').classList.add('hidden');
      document.getElementById('tree').innerHTML = '';
    }

    function exportToExcel() {
      alert('Export to Excel functionality will be added in a future version.');
    }
  </script>
</body>
</html>
