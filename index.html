<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLM Bonus Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9fafb; }
    h2 { color: #1f2937; }
    .card { background: white; padding: 16px; margin: 12px 0; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { font-weight: bold; display: block; margin: 8px 0 4px; }
    input, select { padding: 6px; width: 100%; border: 1px solid #ccc; border-radius: 6px; }
    button { margin: 8px 4px 0; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-export { background: #10b981; color: white; }
    .results { padding: 16px; background: #ecfdf5; border-radius: 12px; }
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .summary-table th, .summary-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    .summary-table th { background: #f3f4f6; }
  </style>
</head>
<body>

  <h2>MLM Bonus Calculator</h2>

  <div class="card">
    <label>Self PV</label>
    <input type="number" id="selfPV" placeholder="Enter your PV">

    <label>Direct PV</label>
    <input type="number" id="directPV" placeholder="Enter direct PV">

    <label>Company Profit (₹)</label>
    <input type="number" id="companyProfit" placeholder="Enter monthly company profit">

    <label>Elite Rank (%)</label>
    <select id="eliteRank">
      <option value="0">None</option>
      <option value="3">AVP (3%)</option>
      <option value="5">VP (5%)</option>
      <option value="6">SVP (6%)</option>
      <option value="7">President (7%)</option>
    </select>
  </div>

  <div class="card">
    <h3>Team PV</h3>
    <div id="teamLevels"></div>
  </div>

  <button class="btn-primary" onclick="calculateBonus()">Calculate Bonus</button>
  <button class="btn-export" onclick="exportExcel()">Export to Excel</button>
  <button class="btn-export" onclick="exportPDF()">Export to PDF</button>

  <div id="results" class="results hidden"></div>

  <script>
    // --- Render team levels ---
    function renderTeamInputs() {
      const container = document.getElementById('teamLevels');
      container.innerHTML = '';
      for (let i = 1; i <= 6; i++) {
        const div = document.createElement('div');
        div.innerHTML = `
          <label>Level ${i} PV</label>
          <input type="number" class="levelPV" id="level${i}" placeholder="Enter PV for Level ${i}">
        `;
        container.appendChild(div);
      }
    }
    renderTeamInputs();

    function calculateBonus() {
      const selfPV = parseFloat(document.getElementById('selfPV').value) || 0;
      const directPV = parseFloat(document.getElementById('directPV').value) || 0;
      const profit = parseFloat(document.getElementById('companyProfit').value) || 0;
      const eliteRank = parseFloat(document.getElementById('eliteRank').value) || 0;

      const levelPercents = { 1: 0.04, 2: 0.03, 3: 0.03, 4: 0.02, 5: 0, 6: 0.02 };

      let totalTeamPV = 0, teamIncome = 0, breakdownHTML = "";

      for (let i = 1; i <= 6; i++) {
        const levelPV = parseFloat(document.getElementById(`level${i}`).value) || 0;
        totalTeamPV += levelPV;
        const levelIncome = levelPV * (levelPercents[i] || 0);
        teamIncome += levelIncome;

        if (levelPercents[i] > 0) {
          breakdownHTML += `<p>Level ${i} Income (${(levelPercents[i]*100).toFixed(0)}% of ₹${levelPV.toLocaleString()}): ₹${levelIncome.toLocaleString()}</p>`;
        }
      }

      const totalPV = selfPV + directPV + totalTeamPV;
      const retailIncome = directPV * 0.08;

      let rankBonus = 0;
      if (totalPV >= 9000000) rankBonus = 15;
      else if (totalPV >= 7500000) rankBonus = 11;
      else if (totalPV >= 6000000) rankBonus = 7.5;
      else if (totalPV >= 4500000) rankBonus = 4.5;
      else if (totalPV >= 3000000) rankBonus = 2;

      const leadershipIncome = totalPV * (rankBonus / 100);
      const eliteBonus = profit * (eliteRank / 100);

      const totalBonus = retailIncome + teamIncome + leadershipIncome + eliteBonus;

      const resultHTML = `
        <h3>Bonus Calculation Results</h3>
        <p><strong>Total PV:</strong> ₹${totalPV.toLocaleString()}</p>
        <p>Retail Income (8%): ₹${retailIncome.toLocaleString()}</p>
        <p><strong>Team Income:</strong> ₹${teamIncome.toLocaleString()}</p>
        <div class="ml-4 text-sm text-gray-700">${breakdownHTML}</div>
        <p>Leadership Bonus (${rankBonus}%): ₹${leadershipIncome.toLocaleString()}</p>
        <p>Elite Bonus: ₹${eliteBonus.toLocaleString()}</p>
        <hr>
        <p class="text-lg font-bold text-green-700">Total Bonus: ₹${totalBonus.toLocaleString()}</p>

        <h4>Summary Table</h4>
        <table class="summary-table">
          <tr><th>Category</th><th>Amount (₹)</th></tr>
          <tr><td>Retail Income</td><td>${retailIncome.toLocaleString()}</td></tr>
          <tr><td>Team Income</td><td>${teamIncome.toLocaleString()}</td></tr>
          <tr><td>Leadership Bonus</td><td>${leadershipIncome.toLocaleString()}</td></tr>
          <tr><td>Elite Bonus</td><td>${eliteBonus.toLocaleString()}</td></tr>
          <tr><th>Total Bonus</th><th>${totalBonus.toLocaleString()}</th></tr>
        </table>
      `;

      const resultBox = document.getElementById('results');
      resultBox.innerHTML = resultHTML;
      resultBox.classList.remove('hidden');
    }

    function exportExcel() {
      const table = document.querySelector(".summary-table");
      const wb = XLSX.utils.table_to_book(table, {sheet:"Bonus"});
      XLSX.writeFile(wb, "BonusCalculation.xlsx");
    }

    async function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const resultsDiv = document.getElementById("results");

      await html2canvas(resultsDiv).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const imgProps = doc.getImageProperties(imgData);
        const pdfWidth = doc.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
        doc.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
        doc.save("BonusCalculation.pdf");
      });
    }
  </script>

</body>
</html>
